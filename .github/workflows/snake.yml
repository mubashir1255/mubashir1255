name: Snake game

# Draws a snake that eats the contribution graph, and publishes it to the "output" branch.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00E5FF&color_dots=#1B0B3B,#5A189A,#9D4EDD,#FF2BD6,#FFD93D
            dist/snake-light.svg?palette=github-light&color_snake=#7B2FF7&color_dots=#ebedf0,#C8B6FF,#9D4EDD,#FF2BD6,#FF7A3D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
